[package]
name         = "llm-transpiler"
version      = "0.1.0"
edition      = "2021"
description  = "High-performance LLM context bridge — token-optimized document transpiler"
rust-version = "1.75"

[lib]
name = "llm_transpiler"
path = "src/lib.rs"

[dependencies]
# 파싱
pulldown-cmark = "0.11"

# 직렬화
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# 비동기
tokio        = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures      = "0.3"

# 유틸
aho-corasick = "1"
ammonia    = "4"
regex      = "1"
once_cell  = "1"
itertools  = "0.13"
thiserror  = "1"
clap       = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio     = { version = "1", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "transpile"
path = "src/bin/transpile.rs"

[[example]]
name = "eval"
path = "eval/eval.rs"

[[example]]
name = "test_docs"
path = "eval/test_docs.rs"

[[bench]]
name    = "transpile_bench"
harness = false
